<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业商务画像｜KCTEC</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="profile.css"></head><body><main><section class="profile-hero"><div class="shell"><span>BUSINESS PROFILE · 기업 프로필</span><h1>建立企业的韩中商务画像</h1><p>准确描述企业能提供什么、需要什么，中心才能推荐真正适合的新闻、商机与合作方。</p></div></section><section class="profile-body"><form class="shell profile-form" id="profileForm"><label>企业名称<input name="company" required></label><label>所在国家<select name="country"><option>中国</option><option>韩国</option><option>其他国家</option></select></label><label>所属行业<input name="sector" placeholder="例如：新材料、食品、LED工程"></label><label>企业能够提供什么<textarea name="supply"></textarea></label><label>目前需要什么<textarea name="demand"></textarea></label><label>目标市场<select name="target"><option>进入中国市场</option><option>进入韩国市场</option><option>双向合作</option></select></label><button>保存商务画像</button><output></output></form></section></main><script src="common.js"></script><script>document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();KCTEC_ACCOUNT.require(()=>{localStorage.setItem('kctec-business-profile',JSON.stringify(Object.fromEntries(new FormData(e.currentTarget))));e.currentTarget.querySelector('output').textContent='商务画像已保存，后续新闻、商机和AI助手将据此提供更适合的内容。'})}</script></body></html>
