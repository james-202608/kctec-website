<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韩中企业与市场资讯｜韩中经贸交流中心</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="media-page"><main>
<section class="media-hero"><div class="shell"><div class="media-kicker"><i></i> KCTEC BUSINESS · 한중 기업 정보</div><h1>看见市场，<br><strong>让企业找到合作。</strong><span lang="ko">시장을 읽고, 기업 협력을 연결합니다.</span></h1><p>精选公开来源，聚焦企业合作、经贸往来、市场拓展及中小企业可参与的现实机会。</p><div class="media-date">UPDATED · 2026.09</div></div></section>
<section class="media-body"><div class="shell"><div class="member-news-bar"><div><span>MEMBER NEWS · 회원 맞춤 뉴스</span><b>我的新闻首页</b><small>企业与市场资讯固定显示，其他领域由我选择</small></div><button id="customizeNews">관심 설정 · 设置我的关注</button></div><div id="newsPrefs" class="news-pref-wrap" hidden></div><div class="channel-tabs" id="channelTabs" role="tablist"></div><div class="channel-head"><span id="channelNo">CORE</span><h2 id="channelTitle">企业与市场</h2><p>优先展示与中小企业经营、合作和市场机会直接相关的内容；保留来源、日期及中韩双语要点。</p></div><div class="media-grid" id="external"></div></div></section>
</main><script src="data.js"></script><script src="common.js"></script><script>
const labels={cooperation:['BUSINESS','企业与市场 · 기업·시장']};const box=document.getElementById('external');
function draw(channel){const list=KCTEC_DATA.externalNews.filter(x=>x.channel===channel);document.getElementById('channelNo').textContent=labels[channel][0];document.getElementById('channelTitle').textContent=labels[channel][1];box.innerHTML=list.map((x,i)=>`<article class="media-card ${i===0?'featured':''}" data-news="${x.id}"><a class="media-thumb" href="${x.url}" target="_blank" rel="noopener">${x.image?`<img src="${x.image}" alt="${x.title_cn}">`:`<div class="news-visual-fallback"><b>${x.visual_label||'KOREA INDUSTRY'}</b><small>기업 협력 · 시장 진출 · 경제무역</small></div>`}<span>${i===0?'주요 뉴스 · 重点关注':'NEWS 0'+(i+1)}</span></a><div class="media-content"><div class="media-meta"><time>${x.date}</time><span>${x.source}</span></div><h3 lang="zh-CN">${x.title_cn}</h3><div class="news-title-kr" lang="ko">${x.title_kr}</div><p>${x.summary_cn}</p>${x.points_cn?`<div class="media-points">${x.points_cn.map((p,j)=>`<div><b>${j+1}</b><p>${p}<small lang="ko">${x.points_kr[j]}</small></p></div>`).join('')}</div>`:''}<a class="media-read" href="${x.url}" target="_blank" rel="noopener">원문 보기 · 阅读原文 ↗</a><div class="article-actions"><button data-act="save">☆ 收藏</button><button data-act="useful">◇ 对我有用</button><button data-act="less">－ 减少此类</button><button data-act="ai">✨ 问AI</button><button data-act="contact">✉ 联系中心</button></div><div class="article-ai"><textarea placeholder="就这条新闻直接提问或留言……"></textarea><button data-ai-send>发送</button><div class="ai-answer"></div></div></div></article>`).join('');restoreActions()}
function drawTabs(){const channels=KCTEC_NEWS_PREFS.channels().filter(c=>labels[c]);document.getElementById('channelTabs').innerHTML=channels.map((c,i)=>`<button class="${i===0?'active':''}" data-channel="${c}"><b>${c==='cooperation'?'必看':'0'+(i+1)}</b><span>${labels[c][1].split(' · ')[0]}<small>${labels[c][1].split(' · ')[1]}</small></span></button>`).join('');document.querySelectorAll('.channel-tabs button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.channel-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');draw(btn.dataset.channel)});draw(channels[0])}drawTabs();const prefs=document.getElementById('newsPrefs');document.getElementById('customizeNews').onclick=()=>{prefs.hidden=!prefs.hidden;if(!prefs.hidden)KCTEC_NEWS_PREFS.render(prefs,()=>{drawTabs();prefs.hidden=true})};
function restoreActions(){document.querySelectorAll('.media-card').forEach(card=>['save','useful','less'].forEach(a=>{if(localStorage.getItem(`kctec-${a}-${card.dataset.news}`)==='1')card.querySelector(`[data-act="${a}"]`).classList.add('active')}))}document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const card=b.closest('.media-card'),a=b.dataset.act;const toggle=()=>{b.classList.toggle('active');localStorage.setItem(`kctec-${a}-${card.dataset.news}`,b.classList.contains('active')?'1':'0')};if(a==='save'){KCTEC_ACCOUNT.require(toggle)}else if(['useful','less'].includes(a)){toggle()}else{const ai=card.querySelector('.article-ai');ai.classList.add('open');if(a==='contact')ai.querySelector('textarea').value='我对这条新闻涉及的合作机会感兴趣，希望交流中心协助进一步了解。';ai.querySelector('textarea').focus()}});document.addEventListener('click',e=>{if(!e.target.matches('[data-ai-send]'))return;const ai=e.target.closest('.article-ai'),q=ai.querySelector('textarea').value.trim();if(!q)return;ai.querySelector('.ai-answer').innerHTML='<b>AI 商务助手</b><br>我会围绕当前新闻回答。该内容可能带来市场或合作机会，但具体政策条件、项目主体和时效性仍需核实。您也可以把问题提交给交流中心进一步跟进。'});
</script></body></html>
