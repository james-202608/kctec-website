<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交流足迹｜韩中经贸交流中心</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main><section class="page-hero warm"><div class="shell"><div class="eyebrow">ACTIVITY ARCHIVE</div><h1>交流足迹</h1><p>这里不仅记录企业合作，也记录会长推动的文化、体育与青少年交流。每一张照片，都是韩中连接真实发生的证据。</p></div></section><section class="section relation"><div class="shell"><div class="filters"><button class="filter active" data-type="all">全部</button><button class="filter" data-type="business">企业合作</button><button class="filter" data-type="culture">文化交流</button><button class="filter" data-type="football">足球友谊</button></div><div class="gallery" id="gallery"></div></div></section></main><script src="data.js"></script><script>const box=document.getElementById('gallery');function draw(type='all'){box.innerHTML=KCTEC_DATA.enterpriseHistory.filter(x=>type==='all'||x.type===type).map(x=>`<figure class="reveal visible"><img data-lightbox src="${x.image}" alt="${x.title_cn}"><figcaption><span class="tag">${x.year}</span><strong style="display:block;margin-top:5px">${x.title_cn}</strong><small>${x.title_kr}</small><p>${x.caption}</p></figcaption></figure>`).join('')}draw();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.type)});</script><script src="common.js"></script></body></html>
