<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C872"/>
      <stop offset="50%" style="stop-color:#F5E6A8"/>
      <stop offset="100%" style="stop-color:#C9A227"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e7a"/>
      <stop offset="100%" style="stop-color:#1a2a5e"/>
    </linearGradient>
  </defs>

  <!-- 最外细环（金色） -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- 外圈（深蓝色，细边） -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2c3e7a" stroke-width="2"/>

  <!-- 内圈白色背景 -->
  <circle cx="100" cy="100" r="90" fill="#ffffff"/>

  <!-- 内装饰细金环 -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- 顶部英文 KOREA-CHINA -->
  <text x="100" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2c3e7a" letter-spacing="2">KOREA-CHINA</text>

  <!-- 底部英文 -->
  <text x="100" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#2c3e7a" letter-spacing="0.8">Economic &amp; Trade Exchange Center</text>

  <!-- 中心地球（简化版，更清晰） -->
  <circle cx="100" cy="88" r="22" fill="none" stroke="#2c3e7a" stroke-width="1.2"/>
  <path d="M78 88 Q100 72 122 88" fill="none" stroke="#2c3e7a" stroke-width="0.9"/>
  <path d="M78 88 Q100 104 122 88" fill="none" stroke="#2c3e7a" stroke-width="0.9"/>
  <line x1="100" y1="66" x2="100" y2="110" stroke="#2c3e7a" stroke-width="0.9"/>
  <line x1="84" y1="72" x2="84" y2="104" stroke="#2c3e7a" stroke-width="0.7"/>
  <line x1="116" y1="72" x2="116" y2="104" stroke="#2c3e7a" stroke-width="0.7"/>

  <!-- 左侧韩国太极（缩小，更精致） -->
  <g transform="translate(52, 88) scale(0.75)">
    <path d="M10 0 A10 10 0 0 1 10 20 A5 5 0 0 1 10 10 A5 5 0 0 0 10 0" fill="#c8102e"/>
    <path d="M10 0 A10 10 0 0 0 10 20 A5 5 0 0 0 10 10 A5 5 0 0 1 10 0" fill="#2c3e7a"/>
  </g>

  <!-- 右侧中国红弧（简化） -->
  <path d="M125 68 Q148 72 150 98 Q148 124 125 128 Q138 98 125 68" fill="#de2910"/>
  <!-- 大星 -->
  <polygon points="134,82 136,88 142,88 137,92 139,98 134,94 129,98 131,92 126,88 132,88" fill="#ffde00"/>
  <!-- 小星们 -->
  <polygon points="144,76 145,78.5 147.5,78.5 145.5,80.5 146.5,83 144,81 141.5,83 142.5,80.5 140.5,78.5 143,78.5" fill="#ffde00"/>
  <polygon points="146,92 147,94.5 149.5,94.5 147.5,96.5 148.5,99 146,97 143.5,99 144.5,96.5 142.5,94.5 145,94.5" fill="#ffde00"/>
  <polygon points="143,106 144,108.5 146.5,108.5 144.5,110.5 145.5,113 143,111 140.5,113 141.5,110.5 139.5,108.5 142,108.5" fill="#ffde00"/>

  <!-- 底部建筑（三条柱，更简洁） -->
  <g transform="translate(80, 115)">
    <rect x="8" y="15" width="7" height="18" fill="#2c3e7a"/>
    <rect x="20" y="6" width="10" height="27" fill="url(#goldGrad)"/>
    <rect x="35" y="17" width="6" height="16" fill="#C9A227"/>
  </g>

  <!-- 橄榄叶（简化，更细） -->
  <g transform="translate(68, 122)">
    <path d="M0 25 Q12 12 22 3" fill="none" stroke="#2c3e7a" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="6" cy="19" rx="4" ry="2" fill="#2c3e7a" transform="rotate(-30 6 19)"/>
    <ellipse cx="13" cy="12" rx="4" ry="2" fill="#2c3e7a" transform="rotate(-45 13 12)"/>
  </g>
  <g transform="translate(132, 122) scale(-1, 1)">
    <path d="M0 25 Q12 12 22 3" fill="none" stroke="#C9A227" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="6" cy="19" rx="4" ry="2" fill="#C9A227" transform="rotate(-30 6 19)"/>
    <ellipse cx="13" cy="12" rx="4" ry="2" fill="#C9A227" transform="rotate(-45 13 12)"/>
  </g>

  <!-- 两侧装饰小点 -->
  <circle cx="30" cy="100" r="2.5" fill="#2c3e7a"/>
  <circle cx="170" cy="100" r="2.5" fill="#C9A227"/>
</svg>
