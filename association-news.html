<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中心新闻｜韩中经贸交流中心</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main><section class="page-hero business"><div class="shell"><div class="eyebrow">ASSOCIATION NEWS</div><h1>中心新闻</h1><p>中文标题下方固定显示韩文标题；点击新闻可阅读中文正文，文章末尾设有独立韩文简短摘要。</p></div></section><section class="section"><div class="shell"><div class="news-list" id="news"></div></div></section></main><script src="data.js"></script><script>document.getElementById('news').innerHTML=KCTEC_DATA.associationNews.map((x,i)=>`<article class="news-row" id="n${x.id}" style="cursor:pointer"><time>${x.date}<br><span class="tag">${x.category}</span></time><div><h3>${x.title_cn}</h3><div class="news-title-kr" lang="ko">${x.title_kr}</div><p>${x.summary_cn}</p><div class="article-panel ${i===0?'open':''}"><img src="${x.image}" alt="${x.title_cn}" data-lightbox style="max-height:420px;margin-bottom:20px"><span class="cn-body-label">中文正文</span><p>${x.content_cn}</p><div class="kr-brief" lang="ko"><b>한국어 간략 요약 · 韩文简短摘要</b>${x.brief_kr}</div></div></div><span class="arrow">${i===0?'−':'＋'}</span></article>`).join('');document.querySelectorAll('.news-row').forEach(r=>r.onclick=e=>{if(!e.target.matches('img')){const p=r.querySelector('.article-panel');p.classList.toggle('open');r.querySelector('.arrow').textContent=p.classList.contains('open')?'−':'＋'}});</script><script src="common.js"></script></body></html>
