<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韩中关系历史资料库｜韩中经贸交流中心</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main><section class="page-hero"><div class="shell"><div class="eyebrow">KOREA–CHINA NEWS ARCHIVE</div><h1>韩中关系历史资料库</h1><p>重大历史事件与每日发布新闻统一保存，按时间和主题持续形成可查询的韩中经贸资料库。</p></div></section><section class="section relation"><div class="shell"><div class="section-head"><div><div class="eyebrow">MAJOR MILESTONES · 주요 역사</div><h2>重大历史节点</h2></div><p>从建交、自由贸易到经贸交流，以时间为轴理解两国关系的重要变化。</p></div><div class="timeline" id="history"></div></div></section><section class="section archive-section"><div class="shell"><div class="archive-head"><div><div class="eyebrow">DAILY ARCHIVE · 매일 뉴스 기록</div><h2>每日新闻历史档案</h2><p>网站发布的新新闻将保留在这里，不因首页更新而消失。</p></div><label class="archive-search"><span>搜索历史新闻</span><input id="archiveSearch" type="search" placeholder="输入标题、来源或关键词" autocomplete="off"></label></div><div class="archive-filters" id="archiveFilters" role="group" aria-label="新闻分类"><button class="active" data-channel="all">全部</button><button data-channel="cooperation">中韩关系</button><button data-channel="korea-tech">韩国新闻</button><button data-channel="china-tech">中国相关</button></div><div class="archive-count" id="archiveCount"></div><div class="archive-list" id="archiveList"></div></div></section><section class="archive-future"><div class="shell"><div class="eyebrow">TODAY & BEYOND</div><h2>历史建立信任，行动连接未来。</h2><p>韩中经贸交流中心将继续以企业的真实需求为起点，推动更务实、更专业、更具延续性的双边合作。</p></div></section></main><script src="data.js"></script><script>
document.getElementById('history').innerHTML=KCTEC_DATA.todayHistory.map(x=>`<div class="milestone"><b>${x.year}</b><span style="display:block;color:#8a6f3f;margin-top:4px">${x.date}</span><h3>${x.title_cn}</h3><small>${x.title_kr}</small><p>${x.description}</p></div>`).join('');
const archive=[...KCTEC_DATA.externalNews].sort((a,b)=>b.date.localeCompare(a.date));const channelLabels={cooperation:'中韩关系 · 한중 관계','korea-tech':'韩国新闻 · 한국 뉴스','china-tech':'中国相关 · 중국 관련'};let activeChannel='all';const input=document.getElementById('archiveSearch');function drawArchive(){const q=input.value.trim().toLowerCase();const rows=archive.filter(x=>(activeChannel==='all'||x.channel===activeChannel)&&(!q||[x.title_cn,x.title_kr,x.source,x.summary_cn,...(x.points_cn||[])].join(' ').toLowerCase().includes(q)));document.getElementById('archiveCount').textContent=`共保存 ${rows.length} 条记录 · 총 ${rows.length}건`;document.getElementById('archiveList').innerHTML=rows.length?rows.map(x=>`<article class="archive-row"><time datetime="${x.date}"><b>${x.date.slice(0,4)}</b><span>${x.date.slice(5)}</span></time><div><em>${channelLabels[x.channel]} · ${x.source}</em><h3><a href="${x.url}" target="_blank" rel="noopener">${x.title_cn}</a></h3><h4 lang="ko">${x.title_kr}</h4><p>${x.summary_cn}</p></div><a class="archive-open" href="${x.url}" target="_blank" rel="noopener" aria-label="阅读原文：${x.title_cn}">↗</a></article>`).join(''):'<div class="archive-empty">没有找到符合条件的历史新闻。</div>'}document.getElementById('archiveFilters').onclick=e=>{const b=e.target.closest('button');if(!b)return;activeChannel=b.dataset.channel;document.querySelectorAll('#archiveFilters button').forEach(x=>x.classList.toggle('active',x===b));drawArchive()};input.oninput=drawArchive;drawArchive();
</script><script src="common.js"></script></body></html>
