<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韩中关系里程碑｜韩中经贸交流中心</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main><section class="page-hero"><div class="shell"><div class="eyebrow">RELATIONSHIP MILESTONES</div><h1>韩中关系里程碑</h1><p>以时间为轴，理解两国关系与经贸合作发展的重要节点。事件主述采用中文，并附简短韩文标题。</p></div></section><section class="section relation"><div class="shell"><div class="timeline" id="history"></div><div style="margin-top:75px;padding:35px;background:#fff;border-left:4px solid var(--gold)"><div class="eyebrow">TODAY & BEYOND</div><h2 style="font:34px 'Noto Serif SC',serif">历史建立信任，行动连接未来。</h2><p style="color:#667085;line-height:1.8">韩中经贸交流中心将继续以企业的真实需求为起点，推动更务实、更专业、更具延续性的双边合作。</p></div></div></section></main><script src="data.js"></script><script>document.getElementById('history').innerHTML=KCTEC_DATA.todayHistory.map(x=>`<div class="milestone"><b>${x.year}</b><span style="display:block;color:#8a6f3f;margin-top:4px">${x.date}</span><h3>${x.title_cn}</h3><small>${x.title_kr}</small><p>${x.description}</p></div>`).join('');</script><script src="common.js"></script></body></html>
